<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emplumados Challenge</title>
  <meta name="description" content="Tabla del reto de SoloQ entre amigos en LAN, al estilo del SoloBoom Challenge.">
  <!-- URL del Worker de Cloudflare (worker/). Vacía = sin botón "Actualizar". -->
  <meta name="actualizar-url" content="https://emplumados-actualizar.fayrlowrn.workers.dev">
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=Grenze+Gotisch:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
  <header class="hero">
    <img class="hero-logo" src="assets/logo.png" alt="CEM Esports" width="160" height="160">
    <p class="hero-kicker">Reto de SoloQ · LAN</p>
    <h1 class="hero-title">Emplumados<wbr>Challenge</h1>
    <p class="hero-meta">
      <span id="count">—</span>
      <span aria-hidden="true">·</span>
      <span id="updated">Cargando…</span>
    </p>
  </header>

  <main>
    <div class="toolbar">
      <div class="refresh" id="refresh-box" hidden>
        <button id="refresh" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          <span>Actualizar</span>
        </button>
        <span id="refresh-status" class="refresh-status" role="status"></span>
      </div>
      <label class="search">
        <span class="visually-hidden">Buscar jugador</span>
        <input id="search" type="search" placeholder="Buscar jugador o cuenta…" autocomplete="off">
      </label>
    </div>

    <div class="board">
      <table id="board">
        <thead>
          <tr>
            <th scope="col" class="c-pos sortable" data-sort="pos" aria-sort="ascending"><button type="button">#</button></th>
            <th scope="col" class="c-change"><span class="visually-hidden">Cambio de posición hoy</span></th>
            <th scope="col" class="c-name">Participante</th>
            <th scope="col" class="c-account">Cuenta</th>
            <th scope="col" class="c-status">Estado</th>
            <th scope="col" class="c-role">Línea</th>
            <th scope="col" class="c-champ">Main</th>
            <th scope="col" class="c-record sortable" data-sort="games"><button type="button">W / L</button></th>
            <th scope="col" class="c-wr sortable" data-sort="winrate"><button type="button">Winrate</button></th>
            <th scope="col" class="c-tier">Elo</th>
            <th scope="col" class="c-lp sortable" data-sort="lp"><button type="button">LP</button></th>
            <th scope="col" class="c-progress sortable" data-sort="progreso"><button type="button" title="LP ganados desde que empezó el reto">Reto</button></th>
            <th scope="col" class="c-last sortable" data-sort="ultima"><button type="button">Última</button></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="empty" hidden>Ningún jugador coincide con la búsqueda.</p>
      <p id="error" class="empty" hidden></p>
    </div>

    <p id="source" class="footnote"></p>
  </main>

  <script src="app.js?v=4"></script>
</body>
</html>
